name: Export and Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp build number
        run: |
          N=$(git rev-list --count HEAD)
          printf 'extends RefCounted\nconst BUILD := %s\n' "$N" > game/build.gd

      - name: Install Godot and export templates
        run: |
          set -e
          cd "$RUNNER_TEMP"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fsSL -o tpl.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mkdir -p /Applications && sudo mv Godot.app /Applications/Godot.app
          unzip -q tpl.tpz
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          mv templates/* "$T/"
          /Applications/Godot.app/Contents/MacOS/Godot --version

      - name: Create iOS preset if export_presets.cfg is missing
        run: |
          if ! grep -q 'platform="iOS"' export_presets.cfg 2>/dev/null; then
            N=0
            [ -f export_presets.cfg ] && N=$(grep -cE '^\[preset\.[0-9]+\]$' export_presets.cfg || true)
            cat >> export_presets.cfg <<PRESET

          [preset.$N]

          name="iOS"
          platform="iOS"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="tools/*, .github/*, *.md"
          export_path="build/ios/MedievalWars.ipa"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.$N.options]

          application/app_store_team_id="AAAAAAAAAA"
          application/bundle_identifier="com.towerwars.medievalwars"
          application/signature=""
          application/short_version="1.0"
          application/version="1"
          application/min_ios_version="14.0"
          application/targeted_device_family=2
          application/export_project_only=true
          icons/icon_1024x1024="res://icons/icon_1024.png"
          PRESET
          fi
          cat export_presets.cfg

      - name: Fill dummy Team ID (Godot refuses to export without one; we sign nothing anyway)
        run: sed -i.bak 's/application\/app_store_team_id=""/application\/app_store_team_id="AAAAAAAAAA"/' export_presets.cfg

      - name: iOS local network permission
        run: bash tools/add_ios_privacy.sh export_presets.cfg

      - name: Import project
        run: |
          G=/Applications/Godot.app/Contents/MacOS/Godot
          $G --headless --path . --import || true
          $G --headless --path . --import || true

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/MedievalWars.ipa || true
          find build/ios -maxdepth 2 | head -30

      - name: Build unsigned IPA
        run: |
          set -e
          PROJ=$(find build/ios -maxdepth 2 -name "*.xcodeproj" | head -1)
          echo "Project: $PROJ"
          if [ -z "$PROJ" ]; then echo "No Xcode project was exported - see the Export Xcode project step"; exit 1; fi
          SCHEME=$(basename "$PROJ" .xcodeproj)
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -archivePath build/MedievalWars.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R build/MedievalWars.xcarchive/Products/Applications/*.app build/Payload/
          (cd build && zip -qr MedievalWars-unsigned.ipa Payload)
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: MedievalWars-ios-unsigned-ipa
          path: build/MedievalWars-unsigned.ipa

      - name: Publish release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: iOS build ${{ github.run_number }}
          files: build/MedievalWars-unsigned.ipa
